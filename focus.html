<!--
Author: Sonia Amanyi
Purpose: Focus mode — a pomodoro-style timer built on top of TaskFlow's task list.
         Built this after Pomofocus and lifeat.io — wanted something that pulled
         directly from my own task list instead of a separate to-do system.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Focus</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/focus.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <div class="logo-section">
                    <i class="fas fa-layer-group"></i>
                    <h1>TaskFlow</h1>
                </div>
                <nav class="app-nav">
                    <a href="index.html"><i class="fas fa-list-check"></i> Tasks</a>
                    <a href="focus.html" class="active"><i class="fas fa-clock"></i> Focus</a>
                </nav>
                <div class="header-actions">
                    <button class="icon-btn" id="themeToggle" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="focus-layout">
            <!-- Timer Column -->
            <section class="focus-main">
                <div class="mode-switch" id="modeSwitch">
                    <button class="mode-btn active" data-mode="focus">Focus</button>
                    <button class="mode-btn" data-mode="short">Short Break</button>
                    <button class="mode-btn" data-mode="long">Long Break</button>
                </div>

                <div class="timer-ring-wrap">
                    <svg class="timer-ring" viewBox="0 0 300 300">
                        <circle class="ring-track" cx="150" cy="150" r="130"></circle>
                        <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="130"></circle>
                    </svg>
                    <div class="timer-center">
                        <div class="timer-display" id="timerDisplay">25:00</div>
                        <div class="timer-task" id="timerTaskLabel">No task selected</div>
                    </div>
                </div>

                <div class="timer-controls">
                    <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-rotate-left"></i></button>
                    <button class="btn btn-primary btn-lg" id="startPauseBtn"><i class="fas fa-play"></i> Start</button>
                    <button class="btn btn-secondary" id="skipBtn"><i class="fas fa-forward"></i></button>
                </div>

                <div class="session-dots" id="sessionDots"></div>

                <!-- Task picker -->
                <div class="task-picker">
                    <label for="focusTaskSelect"><i class="fas fa-thumbtack"></i> Working on</label>
                    <select id="focusTaskSelect">
                        <option value="">No specific task</option>
                    </select>
                </div>

                <!-- Ambient sound -->
                <div class="ambient-panel">
                    <span class="ambient-label"><i class="fas fa-wind"></i> Calm background</span>
                    <div class="ambient-options" id="ambientOptions">
                        <button class="ambient-btn" data-sound="none">Off</button>
                        <button class="ambient-btn" data-sound="rain">Rain</button>
                        <button class="ambient-btn" data-sound="hum">Low Hum</button>
                        <button class="ambient-btn" data-sound="waves">Waves</button>
                    </div>
                    <input type="range" id="ambientVolume" min="0" max="1" step="0.05" value="0.25">
                </div>
            </section>

            <!-- Sidebar: settings + reports -->
            <aside class="focus-side">
                <div class="side-card">
                    <h3><i class="fas fa-sliders"></i> Session Length</h3>
                    <div class="setting-row">
                        <label for="focusMinutes">Focus (min)</label>
                        <input type="number" id="focusMinutes" min="1" max="120" value="25">
                    </div>
                    <div class="setting-row">
                        <label for="shortBreakMinutes">Short break (min)</label>
                        <input type="number" id="shortBreakMinutes" min="1" max="60" value="5">
                    </div>
                    <div class="setting-row">
                        <label for="longBreakMinutes">Long break (min)</label>
                        <input type="number" id="longBreakMinutes" min="1" max="90" value="15">
                    </div>
                    <div class="setting-row">
                        <label for="sessionsBeforeLongBreak">Sessions before long break</label>
                        <input type="number" id="sessionsBeforeLongBreak" min="1" max="10" value="4">
                    </div>
                </div>

                <div class="side-card">
                    <h3><i class="fas fa-chart-simple"></i> Focus Report</h3>
                    <div class="report-stats">
                        <div class="report-stat">
                            <div class="report-num" id="todayMinutes">0m</div>
                            <div class="report-label">Today</div>
                        </div>
                        <div class="report-stat">
                            <div class="report-num" id="weekMinutes">0m</div>
                            <div class="report-label">This week</div>
                        </div>
                    </div>
                    <div class="week-bars" id="weekBars"></div>
                </div>
            </aside>
        </main>
    </div>

    <audio id="alarmSound" preload="auto"></audio>

    <script src="js/storage.js"></script>
    <script src="js/ambient.js"></script>
    <script src="js/focus.js"></script>
    <footer class="site-footer">
    <p>
        © 2026 Sonia Amanyi · TaskFlow ·
        <a href="https://github.com/Jima-Son" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-github"></i> @Jima-Son
        </a>
    </p>
</footer>
</body>
</html>
